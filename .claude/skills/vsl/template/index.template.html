<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>VSL roxo</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/kit.js"></script>
<link rel="stylesheet" href="assets/kit.css">
</head><body>
<!-- Gerado por build-index.mjs a partir de src/index.template.html + src/beats.js. Não edite index.html à mão. -->
<div id="vsl" class="__CLASS__" data-composition-id="vsl" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <div id="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="beam"></div></div>
  <div id="under" style="position:absolute;inset:0"></div>
  <div id="rig"><div id="rigInner">
    <div id="frame">
      <div class="layer" id="layCam"><div class="lens" id="lensCam">
        <video id="cam" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="0" muted playsinline></video>
      </div><div class="lborder"></div></div>
      <div class="layer" id="layText"><div id="behind"></div><div class="lborder"></div></div>
      <div class="layer" id="layMatte">__MATTE__<div class="lborder"></div></div>
      <div id="tint"></div><div id="tint2"></div><div id="rawveil"></div>
      <div class="fborder"></div>
      <div class="fcorner tl"></div><div class="fcorner tr"></div><div class="fcorner bl"></div><div class="fcorner br"></div>
    </div>
  </div></div>
  <div id="inset"></div>
  <div id="cover" style="position:absolute;inset:0;pointer-events:none"></div>
  <div id="ui"></div>
  <div id="cap"></div>
  <div id="fx"></div>
  <audio id="voice" src="assets/clean.mp4" data-start="0" data-duration="__DUR__" data-track-index="1" data-volume="1"></audio>
  __MUSIC__
</div>
<script>
const tl = gsap.timeline({ paused: true });
const CFG = __CFG__;
const WORDS = __WORDS__;
const FACE = __FACE__;
const K = VSL.init({ tl, cfg: CFG, words: WORDS, face: FACE });
K.grade("final", 0);
K.layout("full", 0, 0);

// ======================= BEATS (src/beats.js) =======================
__BEATS__
// ====================================================================

tl.set({}, {}, __DUR__);   // timeline do tamanho exato do vídeo
window.__timelines = window.__timelines || {};
window.__timelines["vsl"] = tl;
</script>
</body></html>
